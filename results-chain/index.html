const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('pw').addEventListener('input',()=>document.getElementById('err').textContent='');
document.getElementById('gate').addEventListener('submit',async e=>{
 e.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');
 if(!pw){err.textContent='Enter the password first.';return;}
 err.textContent='Checking…';
 try{
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  document.getElementById('gate').remove();
  document.getElementById('out').innerHTML=new TextDecoder().decode(pt);
 }catch(_){err.textContent='Incorrect password.';}
});
